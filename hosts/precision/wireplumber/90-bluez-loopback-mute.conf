# Registers bluez-loopback-mute.lua (see that file). The script itself is only
# wanted, not required: should it ever fail to load, WirePlumber runs without
# it instead of without audio. WirePlumber loads components starting from the
# required ones, so a required virtual component pulls the script in.
wireplumber.components = [
  {
    name = bluez-loopback-mute.lua, type = script/lua
    provides = hooks.device.routes.bluez-loopback-mute
  }
  {
    type = virtual, provides = custom.bluez-loopback-mute
    wants = [ hooks.device.routes.bluez-loopback-mute ]
  }
]

wireplumber.profiles = {
  main = {
    custom.bluez-loopback-mute = required
  }
}
