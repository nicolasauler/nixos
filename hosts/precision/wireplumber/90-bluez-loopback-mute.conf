# Registers bluez-loopback-mute.lua (see that file). The script itself is only
# wanted, not required: should it ever fail to load, WirePlumber runs without
# it instead of without audio. WirePlumber loads components starting from the
# required ones, so a required virtual component pulls the script in.
wireplumber.components = [
  {
    name = bluez-loopback-mute.lua, type = script/lua
    provides = hooks.device.routes.bluez-loopback-mute
  }
  {
    type = virtual, provides = custom.bluez-loopback-mute
    wants = [ hooks.device.routes.bluez-loopback-mute ]
  }
]

# Seat monitoring stops the Bluetooth monitor while the login session is
# inactive, which drops connected headsets, and starts a new one when it is
# active again. On precision the kernel switches the console around every
# suspend (since the NVIDIA driver), so that would happen at each resume, and
# the replacement can go wrong: this script once kept the old monitor, so the
# AirPods connected to it and never showed up; in a test, the Bluetooth MIDI
# monitor's replacement failed to register. One user, one seat: keep the
# monitor for as long as WirePlumber runs.
wireplumber.profiles = {
  main = {
    custom.bluez-loopback-mute = required
    monitor.bluez.seat-monitoring = disabled
  }
}
