# Public checks only. The desktop and buildbot-workstation outputs still depend
# on the private certus-infra module and remain local until that module is public.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-checks:
    name: NixOS VM checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable and verify KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          stat -c '%A %U:%G %n' /dev/kvm

      # `id` so the second check below can require that nix actually got
      # installed. See the comment on that step.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        id: install-nix
        with:
          # No `accept-flake-config`: this flake carries no `nixConfig` (see the
          # comment at the top of flake.nix for why it was deleted), and leaving
          # the line would silently pre-authorise whatever `nixConfig` a future
          # commit adds — extra-substituters, extra-trusted-public-keys,
          # post-build-hook — on the one runner that also holds the cache write
          # token. The substituter is armed by cachix-action's own `cachix use`,
          # not by the flake.
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pull + push our own cache. cachix-action registers a nix post-build-hook
      # and pushes every path this job BUILDS, which drives both settings below.
      #
      #   SAFE TODAY, but by VALUE not by structure. This job builds exactly two
      #   checks, `checks.buildbot-fanout` and `checks.nix-substitution-limit`.
      #   The fan-out is safe because #19 wired it to the PUBLIC buildbot-nix
      #   input rather than reaching through the private certus-infra, and its own
      #   writeText passwords are dummies (`tests/buildbot-fanout.nix:38,56`,
      #   "test-password"). The substitution node is safe because it declares no
      #   credential at all: it imports only ./modules/services/nix-daemon-ci.nix,
      #   and its closure paths that the fan-out does not already share carry no
      #   password material (measured — `buildbot-worker`'s password fields are
      #   null and root's hashed-password is the NixOS-test default empty value).
      #   Replace either dummy with a real credential and this job starts
      #   publishing it, with no other signal.
      #
      #   READ THIS BEFORE ADDING A BUILD HERE. certus-infra puts the buildbot
      #   worker password and webhook secret in the store via `pkgs.writeText`.
      #   Measured: …-workers.json is mode 444, contains the literal
      #   `certus-worker-local`, and is reachable from 169 paths in its referrers
      #   closure (19 direct referrers) including
      #   nixos-test-driver-buildbot-workstation and nixos-system-*. So
      #   `checks.buildbot-workstation` and any host toplevel must NEVER be built
      #   in a pushing job. If desktop ever joins public CI, put it in a job
      #   without this step, or fix the secrets first.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: nicnixos
          # Withhold the secret entirely on anything but `push`. `skipPush` alone
          # does NOT do this: cachix-action runs `cachix authtoken` unconditionally
          # whenever authToken is non-empty and only afterwards computes pushMode,
          # so a PR job would finish with a persisted writable token in
          # ~/.config/cachix/cachix.dhall that any later step could use with no
          # token argument. Measured on run 33457632177 (a pull_request run with
          # skipPush true): the step logged `cachix authtoken ***` -> "Written to
          # /home/runner/.config/cachix/cachix.dhall", and only the POST step said
          # "Pushing is disabled".
          #
          # Note the limit of this control: a same-repo PR runs the workflow file
          # FROM the PR branch, so its author can simply delete these lines. It
          # stops accidents and shrinks the window; it is not an insider boundary.
          # A real one needs a GitHub Environment with required reviewers.
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # Belt: never cache a test VERDICT. A check's output IS its pass, so once
          # a `vm-test-run-*` path is in a trusted signed cache, `nix build`
          # substitutes it and the VM never boots again for that closure —
          # demonstrated by accident: a hand-push once took this job from 9m20s to
          # 39s, with the step at 0s and zero subtests run. It also means a single
          # forged push would report success forever.
          #
          # Excluding verdicts costs little, because the time is in the build, not
          # the run: measured on run 33453135443, the step spent 5m57s building the
          # 68 closure paths cache.nixos.org lacks and only 2m43s running the VMs.
          #
          # This is a DENYLIST, and the name it keys on is COMPUTED, not a literal.
          # At the pinned nixpkgs (`nixos/lib/testing/run.nix`) the output name is
          # `"${kind}-test-run-${config.name}"`, where kind comes from the node
          # types — so a check declared with `containers` rather than `nodes` is
          # `container-test-run-…`, which `vm-test-run-` would not have matched.
          # `test-run-` covers all three spellings (vm-, container-,
          # container-and-vm-) and still cannot match the driver
          # (`nixos-test-driver-…`) or anything in its closure.
          #
          # It still does not generalise beyond nixos tests: a future
          # `checks.fmt = runCommand "alejandra-check" …` would have its verdict
          # cached again with no signal. The --no-substitute step below is the half
          # that does generalise. No leading dash — the post-build-hook interpolates
          # this regex unquoted into `grep -vEe`.
          pushFilter: 'test-run-'
          skipPush: ${{ github.event_name != 'push' }}

      - name: Evaluate the public checks
        run: |
          set -euo pipefail
          nix --version
          # `nix eval --raw` prints no trailing newline, so these need one each
          # or the two paths arrive concatenated onto one unreadable line.
          nix eval --raw '.#checks.x86_64-linux.buildbot-fanout.drvPath'; echo
          nix eval --raw '.#checks.x86_64-linux.nix-substitution-limit.drvPath'; echo

      # Two commands, and the split is the structural guarantee that this check
      # actually RUNS rather than being substituted:
      #
      #   1. Realise the check derivation's DIRECT REFERENCES with substitution, so
      #      the expensive inputs come from a cache instead of being rebuilt. Dry-run
      #      measures 27 paths / ~115 MiB.
      #   2. Realise the check itself with --no-substitute, so the VM boots and the
      #      subtests execute even if a cached verdict exists for this closure.
      #
      # It must be the drv's references, NOT just `.driver`. That was the first
      # attempt and it is wrong in a way that only bites once the cache is warm:
      # step 1 realises the driver's OUTPUT, and nix then fetches only that output's
      # RUNTIME closure — 789 paths, which contains bash but NOT stdenv-linux
      # (measured). With stdenv missing and substitution forbidden, step 2 builds
      # 542 derivations: the full stage0-posix bootstrap, hex0-seed through
      # gcc-4.6.4, gcc-10.4.0, binutils, musl, glibc. That needs hours against a
      # 30-minute job timeout, so the check would fail by timeout while still never
      # booting a VM — the same outcome this step exists to prevent. Adding only
      # stdenv-linux to that store drops it to exactly one derivation, which is how
      # the cause was isolated.
      - name: checks.buildbot-fanout
        run: |
          set -euo pipefail
          drv=$(nix eval --raw '.#checks.x86_64-linux.buildbot-fanout.drvPath')
          nix-store --query --references "$drv" | xargs -r nix-store --realise
          nix build -L --no-link --no-substitute "$drv^*"

      # Same two-command form, same reason. Both public checks live in this one
      # job on purpose: the KVM guard above is a single gamble on a free runner,
      # so splitting them into two jobs would roll that die twice for no gain and
      # make a red badge the common case.
      #
      # How often it loses, measured rather than guessed: 6 of the last 26 settled
      # runs of this workflow ended red at `Enable and verify KVM` (23%), and all
      # 6 failed at exactly that step. Treat that as a floor, not the per-attempt
      # rate — `gh run list` reports a run's FINAL conclusion, so reruns that
      # eventually won are counted as successes. This PR's own head lost three
      # consecutive attempts before passing.
      #
      # The condition decouples this check from the fan-out WITHOUT running it in a
      # job that has no nix. Plain sequential steps would have let a fan-out
      # regression abort the job and skip this check entirely, taking all signal
      # from an unrelated test — the two are independent, and only the KVM gamble is
      # shared. But `!cancelled()` alone was wrong: when the KVM guard fails, steps
      # 4-7 are SKIPPED rather than failed, so this step ran with no nix on PATH and
      # produced a second red step reporting a check that never executed. Measured
      # on run 33544209461: `Enable and verify KVM: failure`, install-nix `skipped`,
      # and this step `failure`. That is actively misleading, because the standing
      # advice for a red VM job is "look at whether step 3 failed, and if so nothing
      # else ran".
      #
      # So: require the toolchain, not the sibling check. `conclusion` is 'skipped'
      # for a step that never ran, so this covers both the KVM loss and any earlier
      # setup failure, while still running when only `checks.buildbot-fanout` broke.
      - name: checks.nix-substitution-limit
        if: ${{ !cancelled() && steps.install-nix.conclusion == 'success' }}
        run: |
          set -euo pipefail
          drv=$(nix eval --raw '.#checks.x86_64-linux.nix-substitution-limit.drvPath')
          nix-store --query --references "$drv" | xargs -r nix-store --realise
          nix build -L --no-link --no-substitute "$drv^*"

  host-eval:
    name: Host evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # No `accept-flake-config` here either — and this is the job where it
          # matters most, because `Host evaluation` is the REQUIRED check. Left in,
          # a future flake `nixConfig` adding extra-substituters or
          # extra-trusted-public-keys would be auto-accepted here with no prompt and
          # no signal, silently changing where the required check's inputs come from.
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No cachix step here on purpose: this job only EVALUATES, so it realises
      # nothing to push, and evaluation needs flake inputs rather than built store
      # paths, so pulling would not speed it up either. If a build is ever added
      # to this job, re-read the secret warning on the cachix step above first.

      # Evaluating a host's toplevel catches the breakage that actually happens
      # to this repo: module paths that moved or vanished, and nixpkgs attributes
      # that were REMOVED or renamed without an alias. Both hosts below had
      # rotted silently — notebook imported two modules that no longer existed at
      # those paths, and both carried `du-dust` and `firefox-wayland` after
      # upstream renamed them. Nothing built them, so nothing complained.
      #
      # Know the limits of eval, because this is a required check:
      #   - A rename that leaves an ALIAS only warns, and exits 0. notebook is
      #     green today while warning `hardware.opengl.enable` ->
      #     `hardware.graphics.enable`. That rot class survives until the alias
      #     is dropped upstream.
      #   - A freeform systemd key is SILENTLY DROPPED. Measured: `AlowedCPUs`
      #     for `AllowedCPUs` in precision's serviceConfig evaluates green, and
      #     the agent just loses its E-core pinning with no error anywhere, ever.
      #     Option NAMES are checked (`customrId` fails eval); keys inside a
      #     freeform attrset are not.
      #   - A fixed-output derivation is opaque until built, so `requireFile`
      #     mistakes split two ways. Measured: a misspelled argument
      #     (`hsah`) and a malformed SRI both FAIL eval here — but a wrong
      #     `name`, or a well-formed-but-wrong `hash`, evaluate GREEN and only
      #     fail when the host is really built. So this job validates the shape
      #     of precision's sentinelone block, not the identity of the artifact it
      #     pins.
      #   - Eval does not run build-time check derivations, so a host can be
      #     green here and still fail to build. Demonstrated: adding a bogus
      #     `services.postgresql.settings` key leaves this step green (exit 0)
      #     and only fails when postgresql-configfile-check is built, with
      #     `unrecognized configuration parameter`.
      #
      #     I tried to close that here by realising each host's `system.checks`
      #     and REVERTED it, because the cost is not what it looks like. Warm it
      #     takes 9s; cold on a hosted runner it spent 17 minutes compiling
      #     Hyprland from source and hit the 20-minute timeout (run
      #     33432543307). `ensure-all-wrappers-paths-exist` depends on every
      #     wrapped program, so realising it drags in ~2870 derivations, and
      #     notebook's Hyprland is not in the binary cache. This belongs on a
      #     runner with a warm store, not here. The reproducer, if you want it —
      #     note the `$h` in the loop below only exists inside that bash step, so
      #     name a host explicitly. Measured: the jq/xargs pipeline works in bash
      #     but dies with "write of 161 bytes: Broken pipe" in nushell, which is
      #     what this repo's owner uses, so both forms are given.
      #       bash:
      #         nix eval --json '.#nixosConfigurations.precision.config.system.checks' --apply 'cs: map (c: c.drvPath) cs' | jq -r '.[]' | xargs -r nix-store --realise
      #       nushell:
      #         nix eval --json '.#nixosConfigurations.precision.config.system.checks' --apply 'cs: map (c: c.drvPath) cs' | from json | each { |d| nix-store --realise $d }
      #     (note `system.checks` is a LIST, so plain `nix build` on that
      #     attribute path is rejected with "found a list".)
      #
      # No KVM needed, so this job is not subject to the runner KVM lottery the
      # VM check depends on.
      #
      # NOT evaluated here, deliberately:
      #   desktop   — genuinely consumes the private certus-infra input
      #               (observability + buildbot modules). Verified locally and,
      #               for its buildbot half, by checks.buildbot-workstation.
      #               Public CI would need a deploy key; we are not doing that.
      #
      # precision IS evaluated, including its SentinelOne agent — structurally, per
      # the limits above (the pinned artifact's identity is not checked here). Its
      # proprietary .deb comes from `pkgs.requireFile`, a fixed-output derivation
      # keyed on name + hash, so the host evaluates purely here and the .deb never
      # has to exist on a runner; only a real BUILD needs the file, and that fails
      # loudly with instructions if it is missing. An earlier version took the
      # path from an environment variable, which made the agent's absence the
      # silent default and left this job unable to check that block at all.
      - name: Evaluate CI-able hosts
        run: |
          set -euo pipefail
          for host in notebook xpsbipa precision; do
            echo "::group::$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done
