# Public checks only. The desktop and buildbot-workstation outputs still depend
# on the private certus-infra module and remain local until that module is public.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-checks:
    name: NixOS VM checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable and verify KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          stat -c '%A %U:%G %n' /dev/kvm

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate the public check
        run: |
          set -euo pipefail
          nix --version
          nix eval --raw '.#checks.x86_64-linux.buildbot-fanout.drvPath'

      - name: checks.buildbot-fanout
        run: |
          set -euo pipefail
          nix build -L --no-link '.#checks.x86_64-linux.buildbot-fanout'

  host-eval:
    name: Host evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Evaluating a host's toplevel catches the breakage that actually happens
      # to this repo: module paths that moved or vanished, and nixpkgs attributes
      # that were REMOVED or renamed without an alias. Both hosts below had
      # rotted silently — notebook imported two modules that no longer existed at
      # those paths, and both carried `du-dust` and `firefox-wayland` after
      # upstream renamed them. Nothing built them, so nothing complained.
      #
      # Know the limits of eval, because this is a required check:
      #   - A rename that leaves an ALIAS only warns, and exits 0. notebook is
      #     green today while warning `hardware.opengl.enable` ->
      #     `hardware.graphics.enable`. That rot class survives until the alias
      #     is dropped upstream.
      #   - Eval does not run build-time check derivations, so a host can be
      #     green here and still fail to build. Measured: a bogus
      #     `services.postgresql.settings` key evaluates fine and only fails when
      #     postgresql-configfile-check is built. That is what the second step
      #     below closes — `system.checks` builds exactly those check drvs (a few
      #     seconds) without building the ~24-92 other local drvs per host.
      #
      # No KVM needed, so neither step is subject to the runner KVM lottery the
      # VM check depends on.
      #
      # NOT evaluated here, deliberately:
      #   desktop   — genuinely consumes the private certus-infra input
      #               (observability + buildbot modules). Verified locally and,
      #               for its buildbot half, by checks.buildbot-workstation.
      #               Public CI would need a deploy key; we are not doing that.
      #
      # precision IS evaluated, with its SentinelOne agent unconfigured: the
      # proprietary .deb is an absolute local path that pure evaluation forbids,
      # so hosts/precision/configuration.nix takes it from the environment (unset
      # here => agent off). The blind spot is narrower than "not validated": the
      # module system checks option NAMES even under `mkIf false`, so an upstream
      # sentinelone option rename still fails here. Only its option VALUES go
      # unchecked.
      - name: Evaluate CI-able hosts
        run: |
          set -euo pipefail
          for host in notebook xpsbipa precision; do
            echo "::group::$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done

      # `system.checks` is a LIST of derivations, so `nix build` on that attribute
      # path is rejected ("found a list"). Realise each element's drvPath instead.
      # Measured: ~9s for all three hosts warm, and it catches what eval cannot —
      # a bogus services.postgresql.settings key evaluates green above and fails
      # here with `unrecognized configuration parameter`.
      - name: Build each host's assertion/config checks
        run: |
          set -euo pipefail
          for host in notebook xpsbipa precision; do
            echo "::group::$host"
            nix eval --json ".#nixosConfigurations.$host.config.system.checks" \
              --apply 'cs: map (c: c.drvPath) cs' \
              | jq -r '.[]' \
              | xargs -r nix-store --realise
            echo "::endgroup::"
          done
